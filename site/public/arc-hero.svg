<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.5" fill="#333333" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background — OLED black + dot grid -->
  <rect width="720" height="480" rx="12" fill="#000000"/>
  <rect width="720" height="480" rx="12" fill="url(#dots)"/>

  <!-- Main panel -->
  <rect x="24" y="24" width="672" height="432" rx="8" fill="#111111" stroke="#333333"/>

  <!-- Title bar -->
  <rect x="24" y="24" width="672" height="36" rx="8" fill="#1A1A1A"/>
  <rect x="24" y="52" width="672" height="8" fill="#1A1A1A"/>
  <line x1="24" y1="60" x2="696" y2="60" stroke="#222222"/>
  <circle cx="44" cy="42" r="4" fill="#333333"/>
  <circle cx="58" cy="42" r="4" fill="#333333"/>
  <circle cx="72" cy="42" r="4" fill="#333333"/>
  <text x="96" y="47" fill="#666666" font-family="'Space Mono', monospace" font-size="10" letter-spacing="0.08em">ARC DASHBOARD</text>

  <!-- Left column — profiles + stats -->
  <rect x="36" y="72" width="200" height="372" rx="6" fill="#0A0A0A" stroke="#222222"/>

  <!-- Profile header -->
  <text x="52" y="96" fill="#666666" font-family="'Space Mono', monospace" font-size="9" letter-spacing="0.08em">PROFILES</text>
  <line x1="48" y1="106" x2="224" y2="106" stroke="#222222"/>

  <!-- Active profile -->
  <rect x="44" y="114" width="184" height="32" rx="4" fill="#111111" stroke="#333333"/>
  <circle cx="58" cy="130" r="4" fill="#2563EB"/>
  <text x="70" y="127" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="11">claude-main</text>
  <text x="70" y="139" fill="#666666" font-family="'Space Mono', monospace" font-size="9">Claude Code</text>
  <text x="192" y="133" fill="#2563EB" font-family="'Space Mono', monospace" font-size="8" text-anchor="end" letter-spacing="0.06em">ACTIVE</text>

  <!-- Profile 2 -->
  <circle cx="58" cy="166" r="4" fill="#333333"/>
  <text x="70" y="163" fill="#999999" font-family="'Space Mono', monospace" font-size="11">gemini-dev</text>
  <text x="70" y="175" fill="#666666" font-family="'Space Mono', monospace" font-size="9">Gemini CLI</text>

  <!-- Profile 3 -->
  <circle cx="58" cy="202" r="4" fill="#333333"/>
  <text x="70" y="199" fill="#999999" font-family="'Space Mono', monospace" font-size="11">codex-review</text>
  <text x="70" y="211" fill="#666666" font-family="'Space Mono', monospace" font-size="9">Codex CLI</text>

  <!-- Stats divider -->
  <line x1="48" y1="232" x2="224" y2="232" stroke="#222222"/>
  <text x="52" y="252" fill="#666666" font-family="'Space Mono', monospace" font-size="9" letter-spacing="0.08em">STATUS</text>

  <text x="52" y="276" fill="#666666" font-family="'Space Mono', monospace" font-size="10">HOOKS</text>
  <text x="220" y="276" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10" text-anchor="end">3</text>

  <text x="52" y="294" fill="#666666" font-family="'Space Mono', monospace" font-size="10">TASKS</text>
  <text x="220" y="294" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10" text-anchor="end">2</text>

  <text x="52" y="312" fill="#666666" font-family="'Space Mono', monospace" font-size="10">MEMORY</text>
  <text x="220" y="312" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10" text-anchor="end">847</text>

  <text x="52" y="330" fill="#666666" font-family="'Space Mono', monospace" font-size="10">SESSIONS</text>
  <text x="220" y="330" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10" text-anchor="end">1</text>

  <text x="52" y="348" fill="#666666" font-family="'Space Mono', monospace" font-size="10">SYNC</text>
  <text x="220" y="348" fill="#4A9E5C" font-family="'Space Mono', monospace" font-size="10" text-anchor="end">UP TO DATE</text>

  <!-- Right column — workspace + pipeline + activity -->
  <rect x="248" y="72" width="440" height="372" rx="6" fill="#0A0A0A" stroke="#222222"/>

  <!-- Workspace header -->
  <text x="272" y="100" fill="#666666" font-family="'Space Mono', monospace" font-size="9" letter-spacing="0.08em">WORKSPACE</text>

  <!-- Logo + ARC name -->
  <g transform="translate(272, 114)">
    <polyline points="8 0 0 0 0 28 8 28" stroke="#666666" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <polyline points="14 6 24 14 14 22" stroke="#2563EB" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <polyline points="28 0 36 0 36 28 28 28" stroke="#666666" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </g>
  <text x="320" y="136" fill="#E8E8E8" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">ARC</text>
  <text x="272" y="158" fill="#666666" font-family="'Space Mono', monospace" font-size="10" letter-spacing="0.06em">AGENT RUNTIME CONTROL</text>

  <line x1="272" y1="174" x2="664" y2="174" stroke="#222222"/>

  <!-- Hook pipeline -->
  <text x="272" y="196" fill="#666666" font-family="'Space Mono', monospace" font-size="9" letter-spacing="0.08em">HOOK PIPELINE</text>

  <!-- Segmented bar -->
  <rect x="272" y="208" width="92" height="6" fill="#4A9E5C"/>
  <rect x="368" y="208" width="92" height="6" fill="#4A9E5C"/>
  <rect x="464" y="208" width="92" height="6" fill="#D4A843"/>
  <rect x="560" y="208" width="92" height="6" fill="#222222"/>

  <text x="272" y="228" fill="#999999" font-family="'Space Mono', monospace" font-size="9">PREFLIGHT</text>
  <text x="368" y="228" fill="#999999" font-family="'Space Mono', monospace" font-size="9">VALIDATE</text>
  <text x="464" y="228" fill="#999999" font-family="'Space Mono', monospace" font-size="9">POSTFLIGHT</text>
  <text x="560" y="228" fill="#666666" font-family="'Space Mono', monospace" font-size="9">COMPLETE</text>

  <line x1="272" y1="244" x2="664" y2="244" stroke="#222222"/>

  <!-- Activity log -->
  <text x="272" y="264" fill="#666666" font-family="'Space Mono', monospace" font-size="9" letter-spacing="0.08em">ACTIVITY</text>

  <text x="272" y="286" fill="#666666" font-family="'Space Mono', monospace" font-size="10">09:41:02</text>
  <text x="348" y="286" fill="#4A9E5C" font-family="'Space Mono', monospace" font-size="10">[OK]</text>
  <text x="384" y="286" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10">Hook preflight passed</text>

  <text x="272" y="304" fill="#666666" font-family="'Space Mono', monospace" font-size="10">09:40:58</text>
  <text x="348" y="304" fill="#4A9E5C" font-family="'Space Mono', monospace" font-size="10">[OK]</text>
  <text x="384" y="304" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10">Session resumed</text>

  <text x="272" y="322" fill="#666666" font-family="'Space Mono', monospace" font-size="10">09:40:51</text>
  <text x="348" y="322" fill="#2563EB" font-family="'Space Mono', monospace" font-size="10">[SYNC]</text>
  <text x="398" y="322" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="10">Shared layer pulled</text>

  <text x="272" y="340" fill="#666666" font-family="'Space Mono', monospace" font-size="10">09:40:44</text>
  <text x="348" y="340" fill="#D4A843" font-family="'Space Mono', monospace" font-size="10">[WARN]</text>
  <text x="398" y="340" fill="#999999" font-family="'Space Mono', monospace" font-size="10">Memory nearing limit</text>

  <text x="272" y="358" fill="#666666" font-family="'Space Mono', monospace" font-size="10">09:40:30</text>
  <text x="348" y="358" fill="#4A9E5C" font-family="'Space Mono', monospace" font-size="10">[OK]</text>
  <text x="384" y="358" fill="#999999" font-family="'Space Mono', monospace" font-size="10">Profile switched</text>

  <line x1="272" y1="374" x2="664" y2="374" stroke="#222222"/>

  <!-- Capability tags -->
  <text x="272" y="394" fill="#666666" font-family="'Space Mono', monospace" font-size="9" letter-spacing="0.08em">CAPABILITIES</text>

  <rect x="272" y="404" width="76" height="24" rx="12" fill="transparent" stroke="#333333"/>
  <text x="310" y="420" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.04em">PROFILES</text>

  <rect x="356" y="404" width="66" height="24" rx="12" fill="transparent" stroke="#333333"/>
  <text x="389" y="420" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.04em">HOOKS</text>

  <rect x="430" y="404" width="66" height="24" rx="12" fill="transparent" stroke="#333333"/>
  <text x="463" y="420" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.04em">TASKS</text>

  <rect x="504" y="404" width="76" height="24" rx="12" fill="transparent" stroke="#333333"/>
  <text x="542" y="420" fill="#E8E8E8" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.04em">MEMORY</text>

  <rect x="588" y="404" width="76" height="24" rx="12" fill="transparent" stroke="#2563EB"/>
  <text x="626" y="420" fill="#2563EB" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.04em">SKILLS</text>
</svg>
