<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#04070D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 200) rotate(30) scale(500 300)">
      <stop stop-color="#2563EB" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#1D4ED8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#334155" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo icon -->
  <g transform="translate(80, 180)">
    <rect x="-20" y="-20" width="200" height="200" rx="20" fill="#0F172A" stroke="#334155"/>
    <polyline points="30 20 6 20 6 140 30 140" stroke="#94A3B8" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="72 56 120 80 72 104" stroke="#3B82F6" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="162 20 186 20 186 140 162 140" stroke="#94A3B8" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Text -->
  <g font-family="'Space Grotesk', 'JetBrains Mono', monospace">
    <text x="320" y="260" fill="#F8FAFC" font-size="96" font-weight="800" letter-spacing="-4">ARC</text>
    <text x="320" y="320" fill="#93C5FD" font-size="24" font-weight="700" letter-spacing="4">AGENT RUNTIME CONTROL</text>
    <text x="320" y="390" fill="#94A3B8" font-size="28">Unified control plane for AI coding agents.</text>
    <text x="320" y="430" fill="#64748B" font-size="24">Profiles, supervision, hooks, memory, tasks, and a web dashboard.</text>
  </g>

  <!-- Feature pills -->
  <g font-family="'Space Mono', monospace" font-size="18" font-weight="700">
    <rect x="320" y="470" width="130" height="36" rx="18" fill="#0B1220" stroke="#2563EB"/>
    <text x="385" y="494" fill="#BFDBFE" text-anchor="middle">profiles</text>
    <rect x="466" y="470" width="120" height="36" rx="18" fill="#0B1220" stroke="#334155"/>
    <text x="526" y="494" fill="#CBD5E1" text-anchor="middle">hooks</text>
    <rect x="602" y="470" width="130" height="36" rx="18" fill="#0B1220" stroke="#334155"/>
    <text x="667" y="494" fill="#CBD5E1" text-anchor="middle">memory</text>
    <rect x="748" y="470" width="110" height="36" rx="18" fill="#0B1220" stroke="#334155"/>
    <text x="803" y="494" fill="#CBD5E1" text-anchor="middle">tasks</text>
    <rect x="874" y="470" width="140" height="36" rx="18" fill="#0B1220" stroke="#334155"/>
    <text x="944" y="494" fill="#CBD5E1" text-anchor="middle">dashboard</text>
  </g>

  <!-- URL -->
  <text x="320" y="560" fill="#475569" font-family="'Space Mono', monospace" font-size="18">arc-cli.dev</text>
</svg>
