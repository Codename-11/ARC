<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#04070D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 140) rotate(30) scale(280 200)">
      <stop stop-color="#2563EB" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#1D4ED8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#334155" stroke-opacity=".1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="480" height="400" rx="24" fill="url(#bg)"/>
  <rect width="480" height="400" rx="24" fill="url(#grid)"/>
  <rect width="480" height="400" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="478" height="398" rx="23" fill="none" stroke="#1E293B" stroke-opacity=".5"/>

  <!-- Logo icon — centered at top -->
  <g transform="translate(170, 40)">
    <rect x="-16" y="-16" width="172" height="172" rx="20" fill="#0F172A" stroke="#334155" stroke-opacity=".5"/>
    <polyline points="26 16 4 16 4 124 26 124" stroke="#94A3B8" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="58 46 100 70 58 94" stroke="#3B82F6" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="142 16 164 16 164 124 142 124" stroke="#94A3B8" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Wordmark + subtitle — centered below icon -->
  <g font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">
    <text x="240" y="248" fill="#F8FAFC" font-size="48" font-weight="800" letter-spacing="-2">ARC</text>
    <text x="240" y="278" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="4" font-family="'Space Mono', monospace">AGENT RUNTIME CONTROL</text>
  </g>

  <!-- Feature pills — centered row -->
  <g font-family="'Space Mono', monospace" font-size="11" font-weight="700">
    <rect x="34" y="310" width="84" height="26" rx="13" fill="#0B1220" stroke="#2563EB"/>
    <text x="76" y="327" fill="#BFDBFE" text-anchor="middle">profiles</text>

    <rect x="128" y="310" width="72" height="26" rx="13" fill="#0B1220" stroke="#334155"/>
    <text x="164" y="327" fill="#CBD5E1" text-anchor="middle">hooks</text>

    <rect x="210" y="310" width="82" height="26" rx="13" fill="#0B1220" stroke="#334155"/>
    <text x="251" y="327" fill="#CBD5E1" text-anchor="middle">memory</text>

    <rect x="302" y="310" width="70" height="26" rx="13" fill="#0B1220" stroke="#334155"/>
    <text x="337" y="327" fill="#CBD5E1" text-anchor="middle">tasks</text>

    <rect x="382" y="310" width="92" height="26" rx="13" fill="#0B1220" stroke="#334155"/>
    <text x="428" y="327" fill="#CBD5E1" text-anchor="middle">dashboard</text>
  </g>

  <!-- URL -->
  <text x="240" y="376" fill="#334155" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle">arc-cli.dev</text>
</svg>
